<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dentag Italia — Portale Commerciale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #05182d; --navy2: #0d2540; --navy3: #14304f;
    --gold: #f4b60a; --text: #e8edf3; --muted: #93a3b8; --border: #1c3a5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--navy); color: var(--text); font-family: 'Inter', sans-serif; }
  .layout { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--navy2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 14px;
  }
  .logo { display: flex; align-items: center; gap: 10px; padding: 0 6px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .logo .mark { width: 36px; height: 36px; border-radius: 9px; background: var(--gold); color: var(--navy); font-weight: 700; font-family: 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .logo h1 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; margin: 0; }
  .logo p { font-size: 10.5px; color: var(--muted); margin: 1px 0 0; }

  .menu { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .menu-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
    cursor: pointer; font-size: 13px; color: var(--muted); transition: background .12s, color .12s;
  }
  .menu-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
  .menu-item.attivo { background: rgba(244,182,10,.1); color: var(--gold); font-weight: 600; }

  .footer-sidebar { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
  .utente { font-size: 12px; color: var(--muted); padding: 0 6px 10px; }
  .utente b { color: var(--text); display: block; font-size: 13px; }
  .btn-logout {
    width: 100%; background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 9px; font-size: 12px; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .btn-logout:hover { color: var(--text); border-color: var(--muted); }

  .contenuto { flex: 1; display: flex; flex-direction: column; }
  .contenuto iframe { flex: 1; border: none; width: 100%; }
  .vuoto { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; flex-direction: column; gap: 10px; }

  .hamburger { display: none; position: fixed; top: 14px; left: 14px; z-index: 50; background: var(--navy2); border: 1px solid var(--border); border-radius: 8px; width: 40px; height: 40px; color: var(--text); font-size: 18px; cursor: pointer; }

  @media (max-width: 860px) {
    .hamburger { display: block; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.aperta { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,.4); }
    .contenuto { padding-top: 60px; }
  }
</style>
</head>
<body>

<button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('aperta')">☰</button>

<div class="layout">
  <div class="sidebar">
    <div class="logo">
      <div class="mark">DT</div>
      <div><h1>Dentag Italia</h1><p>Portale Commerciale</p></div>
    </div>

    <div class="menu" id="menu"></div>

    <div class="footer-sidebar">
      <div class="utente"><b id="nome-utente">—</b><span id="ruolo-utente"></span></div>
      <button class="btn-logout" onclick="logout()">Esci</button>
    </div>
  </div>

  <div class="contenuto" id="contenuto">
    <div class="vuoto">
      <div style="font-size:32px">👋</div>
      <div>Seleziona un modulo dal menu a sinistra</div>
    </div>
  </div>
</div>

<script>
  // ===== Configura qui l'URL di ogni modulo (l'URL /exec della relativa dashboard) =====
  var MODULI = {
    crm_lukas:         { etichetta: '📋 CRM Lukas',           url: 'https://script.google.com/macros/s/AKfycby3Zq-5bcCs1PqFhuac2o7yVyRmaQ7wOldAzYIaSlzFfxbY5MNOu-wbjWX7FORzpSrS4g/exec' },
    crm_maurizio:      { etichetta: '📋 CRM Maurizio',        url: 'https://script.google.com/macros/s/AKfycbzBT7YZZ1yIOr44Fu1s1f-bJdpM0Bkuh8VKQc0SAoXp6c9Ro50_X85t-Lwuk51ZsC96Rg/exec' },
    crm_antonio:       { etichetta: '📋 CRM Antonio',         url: 'INCOLLA_URL_DASHBOARD_ANTONIO' },
    crm_gabriele:      { etichetta: '📋 CRM Gabriele',        url: 'https://script.google.com/macros/s/AKfycbxiZ71THZvQYgPaXD6iOow5brUJzElTj2ETFcz6kdbD_dIhwwa1bKkZhA0xedmQvIQy5g/exec' },
    crm_andreas:       { etichetta: '📋 CRM Andreas',         url: 'INCOLLA_URL_DASHBOARD_ANDREAS' },
    crm_venditedirette:{ etichetta: '📋 CRM Vendite Dirette', url: 'INCOLLA_URL_DASHBOARD_VENDITEDIRETTE' },
    crm_depositi:      { etichetta: '📋 CRM Depositi',        url: 'INCOLLA_URL_DASHBOARD_DEPOSITI' },
    crm_globale:       { etichetta: '🌍 CRM Globale',         url: 'INCOLLA_URL_DASHBOARD_GLOBALE' },
    assistenza:        { etichetta: '🛠️ Assistenza Tecnica',  url: 'INCOLLA_URL_ASSISTENZA' }
  };

  var token = sessionStorage.getItem('dentag_token');
  var nome = sessionStorage.getItem('dentag_nome');
  var ruolo = sessionStorage.getItem('dentag_ruolo');
  var moduliConsentiti = JSON.parse(sessionStorage.getItem('dentag_moduli') || '[]');

  if (!token) {
    window.location.href = 'index.html';
  } else {
    document.getElementById('nome-utente').textContent = nome || '';
    document.getElementById('ruolo-utente').textContent = ruolo || '';
    renderMenu();
  }

  function renderMenu() {
    var menu = document.getElementById('menu');
    menu.innerHTML = '';
    moduliConsentiti.forEach(function(chiave) {
      var m = MODULI[chiave];
      if (!m) return;
      var el = document.createElement('div');
      el.className = 'menu-item';
      el.textContent = m.etichetta;
      el.onclick = function() { apriModulo(chiave, el); };
      menu.appendChild(el);
    });
    if (!menu.children.length) {
      menu.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:var(--muted)">Nessun modulo assegnato al tuo account.</div>';
    }
  }

  function apriModulo(chiave, elMenu) {
    document.querySelectorAll('.menu-item').forEach(function(e) { e.classList.remove('attivo'); });
    elMenu.classList.add('attivo');
    var m = MODULI[chiave];
    document.getElementById('contenuto').innerHTML = '<iframe src="' + m.url + '"></iframe>';
    document.querySelector('.sidebar').classList.remove('aperta');
  }

  function logout() {
    sessionStorage.clear();
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
